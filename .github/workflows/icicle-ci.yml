name: ICICLE CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build the Rust harness
        run: cargo +stable build --locked --manifest-path harness/Cargo.toml
      - name: Test the Rust harness and worktree tools
        run: |
          cargo +stable test --locked --manifest-path harness/Cargo.toml
          cargo +stable test --locked --manifest-path worktrees/Cargo.toml
      - name: Test Python tooling
        run: python3 -m unittest discover -s harness/tests -p 'test_*.py'
