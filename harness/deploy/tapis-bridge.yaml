# Lets the sandboxes use a Beam pool running on Tapis Pods instead of a local one.
#
# Tapis only exposes the pool gateway as TLS with SNI on port 443, and the
# sandboxes have no internet access. This stunnel client sits on both
# harness-agents and an outbound network, and forwards plain TCP from
# tapis-gateway:9000 to the Tapis gateway, checking its certificate.
# scripts/connect-tapis.sh starts it; see README.md here.
name: eureka-tapis
services:
  stunnel:
    image: ${BRIDGE_IMAGE:-beam-pool:local}
    # The config is written to tmpfs at startup so the container can stay read-only.
    entrypoint: [sh, -c, 'printf "%s" "$$STUNNEL_CONF" > /tmp/beam.conf && exec stunnel /tmp/beam.conf']
    environment:
      STUNNEL_CONF: |
        foreground = yes
        pid =
        [beam]
        client = yes
        accept = 0.0.0.0:9000
        connect = ${TAPIS_GATEWAY:?set TAPIS_GATEWAY to the Tapis gateway host}:443
        sni = ${TAPIS_GATEWAY}
        checkHost = ${TAPIS_GATEWAY}
        verifyChain = yes
        CAfile = /etc/ssl/certs/ca-certificates.crt
        sslVersionMin = TLSv1.2
    tmpfs: [/tmp]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      agents:
        aliases: [tapis-gateway]
      outbound: {}
networks:
  agents:
    external: true
    name: harness-agents
  outbound: {}
