# Layered on top of lean-beam/deploy/beam-pool/compose.yaml (see README.md).
# Only the gateway joins harness-agents; the workers stay on the pool network.
services:
  gateway:
    networks: [pool, client, agents]
networks:
  agents:
    # The harness's --network default. `internal` blocks internet access, but
    # containers on the network (gateway, sandboxes, retrieval) can reach each other.
    name: harness-agents
    internal: true
